name: petnest

services:
  backend:
    build: .
    container_name: petnest-backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      METRICS_PASSWORD: ${METRICS_PASSWORD:?METRICS_PASSWORD is not set in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: petnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petnest
      POSTGRES_USER: petnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petnest -d petnest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: petnest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: petnest-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/petnest?sslmode=disable
      DATA_SOURCE_USER: petnest
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0-alpine
    container_name: petnest-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_COUNT_KEYS: db0=session:*
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: petnest-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    configs:
      - source: metrics_password
        target: /etc/prometheus/metrics_password

  grafana:
    image: grafana/grafana:13.0.10
    container_name: petnest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

configs:
  metrics_password:
    content: ${METRICS_PASSWORD:?METRICS_PASSWORD is not set in .env}

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
